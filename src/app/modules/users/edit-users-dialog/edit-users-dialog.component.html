<div class="dialog-header">
    <div>
        <h3>Edit User</h3>
    </div>

    <button mat-icon-button (click)="close()">
        <mat-icon>close</mat-icon>
    </button>
</div>

<mat-tab-group class="custom-mat-group">

    <!-- PERSONAL -->
    <mat-tab label="Personal Information">
        <div class="tab-body">

            <h4 class="section-title">
                <mat-icon>person</mat-icon>
                Personal Details
            </h4>

            <form #personalForm="ngForm">

                <div class="two-cols">
                    <mat-form-field appearance="outline">
                        <mat-label>FirstName</mat-label>
                        <input matInput [(ngModel)]="model.clientObject.firstName" name="firstName" required />
                    </mat-form-field>

                    <mat-form-field appearance="outline">
                        <mat-label>LastName</mat-label>
                        <input matInput [(ngModel)]="model.clientObject.lastName" name="lastName" required />
                    </mat-form-field>
                </div>

                <div class="two-cols">
                    <mat-form-field appearance="outline">
                        <mat-label>Phone Number</mat-label>
                        <input type="number" matInput [(ngModel)]="model.clientObject.mobileNumber" name="mobileNumber"
                            required />
                        <mat-icon matSuffix>phone</mat-icon>
                    </mat-form-field>



                    <mat-form-field appearance="outline">
                        <mat-label>Email Address</mat-label>
                        <input matInput [(ngModel)]="model.clientObject.email" name="email" type="email" />
                        <mat-icon matSuffix>mail</mat-icon>
                    </mat-form-field>
                </div>

                <mat-form-field class="full" appearance="outline">
                    <mat-label>ID Number</mat-label>
                    <input matInput [(ngModel)]="model.clientObject.idNumber" name="idNumber" required />
                    <mat-icon matSuffix>credit_card</mat-icon>
                </mat-form-field>

                <div class="two-cols">
                    <mat-form-field appearance="outline">
                        <mat-label>City</mat-label>
                        <input matInput [(ngModel)]="model.clientObject.city" name="city" />
                    </mat-form-field>

                    <mat-form-field appearance="outline">
                        <mat-label>State</mat-label>
                        <input matInput [(ngModel)]="model.clientObject.state" name="state" />
                    </mat-form-field>
                </div>

                <mat-form-field appearance="outline" class="full">
                    <mat-label>Address</mat-label>
                    <textarea matInput rows="3" [(ngModel)]="model.clientObject.address1" name="address1"
                        required></textarea>
                    <mat-icon matSuffix>location_on</mat-icon>
                </mat-form-field>

            </form>
        </div>
    </mat-tab>


</mat-tab-group>

<div class="dialog-footer">

    <span class="spacer"></span>

    <button mat-button (click)="close()">Cancel</button>

    <button mat-flat-button color="primary" [disabled]="!isFormValid()" (click)="save()">
        Save
    </button>
</div>
