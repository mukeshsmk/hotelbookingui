        <button mat-raised-button color="primary" (click)="openAddBookingModal()">
            Add Booking
        </button>
    </div>

    <div class="table-wrapper mat-elevation-z4">
        <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">

            <!-- ID -->
            <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
                <td mat-cell *matCellDef="let row">{{ row.id }}</td>
            </ng-container>

            <!-- Name -->
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
                <td mat-cell *matCellDef="let row">
                    {{ getFullName(row) }}
                </td>
            </ng-container>

            <!-- Mobile -->
            <ng-container matColumnDef="mobileNumber">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Mobile</th>
                <td mat-cell *matCellDef="let row">{{ row.mobileNumber }}</td>
            </ng-container>

            <!-- ID Number -->
            <ng-container matColumnDef="idNumber">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>ID Number</th>
                <td mat-cell *matCellDef="let row">{{ row.idNumber }}</td>
            </ng-container>

            <!-- Address -->
            <ng-container matColumnDef="address">
                <th mat-header-cell *matHeaderCellDef>Address</th>
                <td mat-cell *matCellDef="let row">{{ row.address1 }}</td>
            </ng-container>

            <!-- Pincode -->
            <ng-container matColumnDef="pinCode">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Pincode</th>
                <td mat-cell *matCellDef="let row">{{ row.pinCode }}</td>
            </ng-container>

            <!-- Status -->
            <ng-container matColumnDef="status">
                <th mat-header-cell *matHeaderCellDef>Status</th>
                <td mat-cell *matCellDef="let row">
                    <span class="status-badge" [class.active]="row.status === 1">
                        {{ getStatusLabel(row.status) }}
                    </span>
                </td>
            </ng-container>

            <!-- ACTIONS COLUMN -->
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef> Actions </th>

                <td mat-cell *matCellDef="let row">
                    <button mat-icon-button [matMenuTriggerFor]="menu" (click)="$event.stopPropagation()">
                        <mat-icon>more_vert</mat-icon>
                    </button>

                    <mat-menu #menu="matMenu">
                        <button mat-menu-item (click)="viewClient(row)">
                            <mat-icon>visibility</mat-icon>
                            <span>View</span>
                        </button>

                        <button mat-menu-item (click)="editClient(row)">
                            <mat-icon>edit</mat-icon>
                            <span>Edit</span>
                        </button>

                        <button mat-menu-item (click)="deleteClient(row)">
                            <mat-icon>delete</mat-icon>
                            <span>Delete</span>
                        </button>
                    </mat-menu>
                </td>
            </ng-container>


            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        </table>

        <mat-paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons>
        </mat-paginator>
    </div>
</div>
