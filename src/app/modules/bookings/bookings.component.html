<div class="table-container">
    <div class="filters">
        <mat-form-field appearance="outline">
            <mat-label>Check-in from</mat-label>
            <input matInput [matDatepicker]="picker1" [(ngModel)]="filterCheckInStart" (dateChange)="applyFilters()">
            <mat-datepicker-toggle matSuffix [for]="picker1"></mat-datepicker-toggle>
            <mat-datepicker #picker1></mat-datepicker>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Check-out to</mat-label>
            <input matInput [matDatepicker]="picker2" [(ngModel)]="filterCheckOutEnd" (dateChange)="applyFilters()">
            <mat-datepicker-toggle matSuffix [for]="picker2"></mat-datepicker-toggle>
            <mat-datepicker #picker2></mat-datepicker>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Search Guest</mat-label>
            <input matInput placeholder="Guest name" (keyup)="applyGuestFilter($event)">
        </mat-form-field>

        <button mat-raised-button color="primary" (click)="openAddBookingModal()">
            Add Booking
        </button>
    </div>


    <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">

        <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Booking ID </th>
            <td mat-cell *matCellDef="let element"> {{element.id}} </td>
        </ng-container>

        <ng-container matColumnDef="guestName">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Guest Name </th>
            <td mat-cell *matCellDef="let element"> {{element.guestName}} </td>
        </ng-container>

        <ng-container matColumnDef="room">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Room </th>
            <td mat-cell *matCellDef="let element"> {{element.room}} </td>
        </ng-container>

        <ng-container matColumnDef="checkIn">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Check-in </th>
            <td mat-cell *matCellDef="let element"> {{element.checkIn}} </td>
        </ng-container>

        <ng-container matColumnDef="checkOut">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Check-out </th>
            <td mat-cell *matCellDef="let element"> {{element.checkOut}} </td>
        </ng-container>

        <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Status </th>
            <td mat-cell *matCellDef="let element">
                <span class="badge" [ngClass]="{
                          'status-checked-in': element.status === 'Checked-in',
                          'status-pending': element.status === 'Pending',
                          'status-checked-out': element.status === 'Checked-out'}">
                    {{element.status}}
                </span>
            </td>
        </ng-container>

        <ng-container matColumnDef="payment">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Payment </th>
            <td mat-cell *matCellDef="let element">
                <span class="badge" [ngClass]="{
                      'payment-paid': element.payment === 'Paid',
                      'payment-due': element.payment === 'Due'
                    }">{{element.payment}}
                </span>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
</div>
