<div class="card" [style.--card-accent]="color">
    <div class="card-header">
        <div class="info">
            <p>{{ title }}</p>
            <h2>{{ value }}</h2>
        </div>
        <div class="icon" [ngStyle]="{'background-color': color}">
            <mat-icon>{{ icon }}</mat-icon>
        </div>
    </div>
</div>
