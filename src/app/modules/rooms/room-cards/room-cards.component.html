<div class="ft-container-spinner" *ngIf="isLoading">
    <mat-spinner></mat-spinner>
</div>
<div class="rooms-grid">
    <div class="room-card" *ngFor="let room of rooms">

        <div class="room-header" [ngClass]="getStatusClass(room.statusName)">
            <div>
                <small>{{ room.floorName }}</small>
                <h2>Room {{ room.roomNumber }}</h2>
                <div class="people-details">
                    <mat-icon matSuffix>bed</mat-icon> {{ room.roomTypeName }}
                </div>
            </div>
            <span class="status-badge" [ngClass]="getStatusClass(room.statusName)">
                {{ room.statusName }}
            </span>
        </div>

        <div class="room-body">


            <div *ngIf="room.checkinDts" class="checkin-section">
                <p class="checkin">
                    <mat-icon matSuffix>login</mat-icon>
                    <span>Check-in : {{ room.checkinDts | date:'dd/mm/yyyy'}}</span>
                </p>
                <p class="checkin">
                    <mat-icon matSuffix>logout</mat-icon>
                    <span>Check-out : {{ room.checkoutDts | date:'dd/mm/yyyy' }}</span>
                </p>
            </div>
        </div>



        <div class="room-footer">
            <button class="custom-btn add-btn" *ngIf="room.statusName === 'Available'" (click)="addGuest(room)">
                <mat-icon matSuffix>person</mat-icon> Check In
            </button>
            <button class="custom-btn view-btn" *ngIf="room.statusName === 'Checked-in'" (click)="viewDetails(room)">
                <mat-icon matSuffix>visibility</mat-icon> View Guest
            </button>
            <button class="custom-btn add-btn mar-lft-10" *ngIf="room.statusName === 'Checked-in'" (click)="checkOut()">
                <mat-icon matSuffix>person</mat-icon> Check Out
            </button>
        </div>

    </div>
</div>
