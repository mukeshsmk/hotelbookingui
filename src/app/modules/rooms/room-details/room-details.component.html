<mat-card class="room-card" (click)="onSelectRoom()" [ngClass]="getCardClass(room.status)">

    <div class="room-header">
        <h3 class="room-title">Room {{ room.roomNumber }}</h3>

        <!-- STATUS BADGE -->
        <span class="status-badge" [ngClass]="getStatusClass('Available')">
            Available
        </span>
    </div>

    <div class="room-body">
        <p class="guest-name" *ngIf="room.guestName">{{ room.guestName }}</p>
        <p class="guest-name muted" *ngIf="!room.guestName">No guest assigned</p>

        <p class="sub-text" *ngIf="room.checkOut">
            Check-out: {{ room.checkOut | date:'dd/MM/yyyy' }}
        </p>

        <p class="sub-text" *ngIf="room.roomType">
            {{ room.roomType }}
        </p>

        <!-- <div class="room-footer">
            <button class="custom-btn add-btn" *ngIf="room.status === 'Available'" (click)="addGuest(room)">
                Add Guest
            </button>
            <button class="custom-btn view-btn" *ngIf="room.status === 'Occupied'" (click)="viewDetails(room)">
                View Guest
            </button>
            <button *ngIf="room.status !== 'Available' && room.status !== 'Occupied'" disabled>
                {{ room.status }}
            </button>
        </div> -->
    </div>

    <!-- ⭐ HOVER OVERLAY BUTTON ⭐ -->

                <span *ngSwitchDefault>View Details</span>

        </button>

    </div> -->


</mat-card>
